name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.11.0"
  GO_VERSION: "1.25"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          go-version: ${{ env.GO_VERSION }}
          install-deps: "true"
          setup-go: "true"
          build-mmdbwriter: "true"

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Check formatting
        run: pnpm exec prettier --check .github/actions .github/workflows scripts src package.json test
