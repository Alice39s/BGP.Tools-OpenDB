name: Daily Release

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: "Specify release date (YYYY-MM-DD)"
        required: false
        type: string
      source_branch:
        description: "Branch to release from"
        required: false
        type: string
        default: "auto-update"
      refresh_data:
        description: "Refresh data before release (recommended)"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "30 0 * * *"

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.11.0"
  GO_VERSION: "1.25"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Cleanup disk space
        uses: ./.github/actions/cleanup-disk-space
        with:
          clean-tools-cache: "false"
          clean-docker: "false"

      - name: Resolve release data source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            source_branch="auto-update"
          else
            source_branch="${INPUT_SOURCE_BRANCH:-auto-update}"
          fi

          if ! git check-ref-format --branch "$source_branch" >/dev/null; then
            echo "Invalid source branch: $source_branch"
            exit 1
          fi

          echo "branch=$source_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout release data source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.source.outputs.branch }}
          path: source-data

      - name: Copy release data source
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail

          for data_dir in table asns tags; do
            if [[ ! -d "source-data/$data_dir" ]]; then
              echo "Missing $data_dir/ in source branch $SOURCE_BRANCH"
              exit 1
            fi

            rm -rf "$data_dir"
            cp -a "source-data/$data_dir" "$data_dir"
          done

          rm -rf source-data

      - name: Setup tooling
        uses: ./.github/actions/setup-runtime
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-deps: "true"
          go-version: ${{ env.GO_VERSION }}
          setup-go: "true"
          build-mmdbwriter: "true"

      # 仅 workflow_dispatch 且 refresh_data==true 时，运行数据更新脚本
      - name: Refresh data (manual trigger only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_data }}
        run: |
          echo "🔄 Running data update before release..."
          pnpm fetch:all
          echo "✅ Data refresh complete."

      - name: Validate release data
        run: |
          set -euo pipefail

          for required_file in \
            table/table-original.jsonl \
            asns/asns.csv \
            tags/tags.txt; do
            if [[ ! -s "$required_file" ]]; then
              echo "Required release data is missing or empty: $required_file"
              exit 1
            fi
          done

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Set release date
        id: date
        env:
          RELEASE_DATE_INPUT: ${{ inputs.release_date }}
        run: |
          set -euo pipefail

          if [[ -n "$RELEASE_DATE_INPUT" ]]; then
            RELEASE_DATE="$RELEASE_DATE_INPUT"
          else
            RELEASE_DATE=$(date -u +"%Y-%m-%d")
          fi

          if [[ ! "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid release date: $RELEASE_DATE"
            exit 1
          fi

          if ! parsed_date=$(date -u -d "$RELEASE_DATE" +"%Y-%m-%d" 2>/dev/null); then
            echo "Invalid release date: $RELEASE_DATE"
            exit 1
          fi

          if [[ "$parsed_date" != "$RELEASE_DATE" ]]; then
            echo "Invalid release date: $RELEASE_DATE"
            exit 1
          fi

          echo "RELEASE_DATE=${RELEASE_DATE}" >> "$GITHUB_ENV"
          echo "date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Generate release files
        run: |
          echo "🚀 Generating release files using Node.js compression..."
          ls -la table/ asns/ tags/ 2>/dev/null || true

          # Use Node.js script with NAPI xz compression
          ./scripts/compress-release-files.js

      - name: Calculate checksums
        run: |
          cd release-assets
          sha256sum -- * > checksums.sha256
          cd -

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-files-${{ steps.date.outputs.date }}
          path: release-assets

      - name: Generate release notes
        run: |
          cat > release-notes.md << EOF
          # BGP.Tools OpenDB - ${RELEASE_DATE}

          📅 **Release date**: ${RELEASE_DATE}

          ## 📦 Data included

          ### Full-Table Archive
          - \`table-${RELEASE_DATE}.jsonl.gz\` - Global routing table data (gzip compressed)
          - \`table-${RELEASE_DATE}.jsonl.xz\` - Global routing table data (xz compressed, smaller file)

          ### ASN-Mapping Table
          - \`asns-${RELEASE_DATE}.csv.gz\` - ASN to name mapping (gzip compressed)
          - \`asns-${RELEASE_DATE}.csv.xz\` - ASN to name mapping (xz compressed, smaller file)

          ### ASN-Tags Data
          - \`tags-*-${RELEASE_DATE}.csv.gz\` - Various category tag data (gzip compressed)
          - \`tags-*-${RELEASE_DATE}.csv.xz\` - Various category tag data (xz compressed, smaller file)

          ### Checksums
          - \`checksums.sha256\` - SHA256 checksums for all files

          ## 📊 Data sources

          All data comes from [bgp.tools](https://bgp.tools) HTTP API, obtained at: $(date -u +"%Y-%m-%d %H:%M UTC")

          ## 🔗 Related links

          - [Project homepage](https://github.com/${{ github.repository }})
          - [BGP.Tools](https://bgp.tools)
          - [Auto-update branch](https://github.com/${{ github.repository }}/tree/auto-update)

          ---

          *This release is automatically generated by GitHub Actions*
          EOF

      - name: Create GitHub Release (attempt 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: BGP.Tools OpenDB - ${{ steps.date.outputs.date }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          target_commitish: ${{ github.event.repository.default_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before retrying GitHub Release (attempt 2)
        if: ${{ steps.release_attempt_1.outcome == 'failure' }}
        run: sleep 5

      - name: Create GitHub Release (attempt 2)
        id: release_attempt_2
        if: ${{ steps.release_attempt_1.outcome == 'failure' }}
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: BGP.Tools OpenDB - ${{ steps.date.outputs.date }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          target_commitish: ${{ github.event.repository.default_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before retrying GitHub Release (attempt 3)
        if: ${{ steps.release_attempt_1.outcome == 'failure' && steps.release_attempt_2.outcome == 'failure' }}
        run: sleep 10

      - name: Create GitHub Release (attempt 3)
        id: release_attempt_3
        if: ${{ steps.release_attempt_1.outcome == 'failure' && steps.release_attempt_2.outcome == 'failure' }}
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: BGP.Tools OpenDB - ${{ steps.date.outputs.date }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          target_commitish: ${{ github.event.repository.default_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release result
        if: always()
        run: |
          set -euo pipefail

          if [[ "${{ steps.release_attempt_1.outcome }}" == "success" || \
            "${{ steps.release_attempt_2.outcome }}" == "success" || \
            "${{ steps.release_attempt_3.outcome }}" == "success" ]]; then
            exit 0
          fi

          echo "GitHub Release failed after three attempts"
          exit 1

      - name: Clean up
        if: always()
        run: |
          shopt -s nullglob
          generated_files=(
            "table-${RELEASE_DATE:-}".jsonl*
            "asns-${RELEASE_DATE:-}".csv*
            "tags-*-${RELEASE_DATE:-}".csv*
          )

          rm -rf release-assets release-notes.md source-data table asns tags
          if (( ${#generated_files[@]} > 0 )); then
            rm -f -- "${generated_files[@]}"
          fi
